<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портик</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Портик" id="apptitle">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:'Forum';src:url('fonts/forum.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url('fonts/literata.woff2') format('woff2');font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url('fonts/literata-italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
:root{--paper:#F5F5F2;--ink:#000;--text:#2A2A27;--stone:#6B6A64;--rule:#DAD9D3;--accent:#6E2B3A;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#000;--ink:#fff;--text:#E6E6E1;--stone:#9A9992;--rule:#2C2C2A;--accent:#D58C99;color-scheme:dark}}
*{box-sizing:border-box}html,body{background:var(--paper);margin:0;min-height:100%}
body{color:var(--text);font-family:'Literata',Georgia,serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;padding:28px 22px 40px;max-width:620px;margin:0 auto;overflow-wrap:break-word}
.k{font-size:13px;color:var(--stone);margin:0 0 10px}
.q{font-family:'Forum','Times New Roman',serif;color:var(--ink);font-size:clamp(28px,7.6vw,40px);line-height:1.2;margin:0}
cite{display:block;margin-top:16px;font-style:italic;font-size:15px;color:var(--stone)}
h1{font-family:'Forum','Times New Roman',serif;font-weight:400;color:var(--ink);font-size:clamp(30px,8.6vw,38px);line-height:1.1;margin:0 0 6px;-webkit-hyphens:auto;hyphens:auto}
.m{font-size:14px;color:var(--stone);margin:0 0 18px}
ol{margin:0;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--rule)}
ol li::before{content:counter(s);font-family:'Forum',serif;color:var(--stone);font-size:19px}
.big{font-family:'Forum','Times New Roman',serif;color:var(--ink);font-size:clamp(40px,13vw,64px);line-height:1;margin:6px 0}
.sub{font-size:15px;color:var(--stone)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin:18px 0}
.stats div{border-top:1px solid var(--rule);padding-top:8px}
.stats b{display:block;font-family:'Forum',serif;font-weight:400;font-size:26px;color:var(--ink);line-height:1.1}
.stats span{font-size:12.5px;color:var(--stone);line-height:1.3;display:block;margin-top:2px}
canvas{display:block;margin:14px 0}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--stone)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.foot{margin-top:28px;font-size:13px;color:var(--stone)}
.foot a{color:var(--accent)}
.err{color:var(--stone)}
</style>
</head>
<body>
<div id="app"><p class="err">Загружаю…</p></div>
<script src="w.js" defer></script>
</body>
</html>
