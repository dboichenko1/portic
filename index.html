  if (s.mode === 'time') return { aria:'Учет времени', body: timeBody(s) };
  if (s.mode === 'home') return { aria:'Виджеты', body: homeConfBody(s) };
  if (s.mode === 'expnew') return { aria:'Новый эксперимент', body: expNewBody(s), foot:'<button class="next" data-act="expstart">Начать</button>' };
  if (s.mode === 'exp') return { aria:'Эксперимент', body: expDetailBody(s) };
  if (s.mode === 'dict') return { aria:'Словарь', body: dictBody(s) };
  if (s.mode === 'rating'){
    const body = '<p class="kicker">Самооценка</p><h1 class="s-title">Как я сейчас</h1>'
      + '<p class="s-idea">Честно, без скромности и без бравады. Это вторая линия на паутине: сравнить, что тренирую и как себя вижу. Раз в неделю или две достаточно.</p>'
      + VIRT.map(v => '<div class="slider-row"><div class="slider-top"><b><span class="sw bg-'+v.id+'"></span><label for="rt-'+v.id+'">'+esc(v.name)+'</label></b><output id="out-'+v.id+'">'+s.values[v.id]+'</output></div><small>'+esc(v.modern)+'</small><input type="range" min="0" max="10" step="1" id="rt-'+v.id+'" data-rate="'+v.id+'" value="'+s.values[v.id]+'"></div>').join('');
    return { aria: 'Самооценка', body, foot: '<button class="next" data-act="saverate">Сохранить оценку</button>' };
  }
  return { aria:'', body:'' };
}

function renderSheet(keep){
  const s = state.sheet;
  if (!s){ $sheet.innerHTML = ''; return; }
  document.body.style.overflow = 'hidden';
  if (s.mode !== 'session'){
    const prev = $sheet.querySelector('.sheet-body');
    const top = keep && prev ? prev.scrollTop : 0;
    const { aria, body, foot } = sheetBody(s);
    $sheet.innerHTML = frame(s, aria, '', body, foot);
    if (s.mode === 'time') drawLife();
    const b = $sheet.querySelector('.sheet-body'); if (b) b.scrollTop = top;
    if (!keep) $sheet.querySelector('.close').focus();
    return;
  }
  const st = s.steps[s.i];
  const last = s.i === s.steps.length - 1;
  const label = s.kind === 'morning' ? 'Утро' : s.kind === 'evening' ? 'Вечер' : s.ex.title;
  const top = '<div class="progress" aria-label="Шаг '+(s.i+1)+' из '+s.steps.length+'">'+s.steps.map((_,i) => '<i class="'+(i<=s.i?'on':'')+'"></i>').join('')+'</div>';
  const foot = (s.i>0?'<button class="back" data-act="prev">Назад</button>':'')
    + '<button class="next" data-act="'+(last?'save':'next')+'">'+(last?'Сохранить в дневник':(st.type==='intro'?'Начать':'Дальше'))+'</button>';
  $sheet.innerHTML = frame(s, label, top, stepBody(st, s), foot);
  $sheet.querySelectorAll('textarea').forEach(autosize);
  const body = $sheet.querySelector('.sheet-body'); if (body) body.scrollTop = 0;
  const ta = $sheet.querySelector('textarea');
  if (ta && st.type === 'prompt') { try { ta.focus({ preventScroll:true }); } catch(e){} }
  else { const c = $sheet.querySelector('.close'); if (c) c.focus(); }
}

async function saveSession(){
  const s = state.sheet; if (!s) return;
  const answers = [];
  let virtue = null;
  s.steps.forEach(st => {
    if (st.type === 'prompt' || st.type === 'principles') answers.push({ q: st.q, a: s.answers[st.key] || '' });
    if (st.type === 'virtue'){
      const v = s.answers[st.key+'_v'] || ''; const t = s.answers[st.key] || '';
      if (v) virtue = VNAME2ID[v] || null;
      answers.push({ q: st.q, a: [v, t].filter(Boolean).join('. ') });
    }
    if (st.type === 'pickex'){
      const id = s.answers[st.key] || st.def;
      answers.push({ q: st.q, a: EXMAP[id] ? EXMAP[id].title : '' });
    }
  });
  const entry = { id: uid(), kind: s.kind, title: s.kind === 'morning' ? 'Утренняя подготовка' : s.kind === 'evening' ? 'Вечерний разбор' : s.ex.title, answers, createdAt: Date.now(), day: today() };
  if (s.kind === 'exercise') entry.exId = s.ex.id;
  if (s.kind === 'morning'){ entry.focusId = s.answers.focus || (s.steps.find(x => x.type === 'pickex') || {}).def || null; if (virtue) entry.virtue = virtue; }
  clearDraft();
  closeAll();
  await store.add(entry);
  toast('Сохранено в дневник');
  renderMain();
}
async function saveRating(){
  const s = state.sheet; if (!s) return;
  const ratings = Object.assign({}, s.values);
  const entry = { id: uid(), kind:'rating', title:'Самооценка добродетели', ratings, answers: VIRT.map(v => ({ q: v.name, a: ratings[v.id] + ' из 10' })), createdAt: Date.now(), day: today() };
  closeAll();
  await store.add(entry);
  toast('Оценка сохранена');
  renderMain();
}

let toastTimer = null;

/* ---------- events ---------- */
const READER_ACTS = new Set(['ropen','rclose','rnext','rprev','rgoto','rtoc','rset','rpclose','rpsave','rpremove','rselword','rptheme','rpsize','rpfont','rplh','rpmargin','rpjust','rplang','rsplit','rpsplit','rpoff','rpflip']);
async function onAct(b){
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'tab'){ state.tab = id; state.confirmDel = null; renderMain(); window.scrollTo(0,0); return; }
  if (act === 'flow') return startFlow(id);
  if (act === 'ex') return pushSheet({ mode:'detail', ex: EXMAP[id], theme:'t-page' });
  if (act === 'virtue') return pushSheet({ mode:'virtue', id, theme:'t-page' });
  if (act === 'subvirtue') return pushSheet({ mode:'subvirtue', id, theme:'t-page' });
  if (act === 'doctrine') return pushSheet({ mode:'doctrine', id, theme:'t-page' });
  if (act === 'rate'){
    const last = latestRating();
    const values = {}; VIRT.forEach(v => { values[v.id] = last ? (last.ratings[v.id] ?? 5) : 5; });
    return pushSheet({ mode:'rating', theme:'t-page', values });
  }
  if (act === 'saverate') return saveRating();
  if (READER_ACTS.has(act)) return onReaderAct(act, id);
  if (act === 'bookadd'){ const f = document.getElementById('book-file'); if (f) f.click(); return; }
  if (act === 'bookdel'){
    if (state.confirmBook !== id){ state.confirmBook = id; return renderMain(); }
    state.confirmBook = null;
    try { await IDB.del(id); } catch(e){}
    state.books = state.books.filter(b => b.id !== id); state.books.forEach(b => { if (b.pair && b.pair.id === id) delete b.pair; }); saveBooks(); toast('Книга удалена'); return renderMain();
  }
  if (act === 'pairlink'){
    const a = (document.getElementById('pair-a') || {}).value, b2 = (document.getElementById('pair-b') || {}).value;
    if (!a || !b2 || a === b2){ toast('Выбери две разные книги'); return; }
    const m = state.books.find(x => x.id === a); if (!m) return;
    state.books.forEach(x => { if (x.pair && (x.pair.id === a || x.pair.id === b2 || x.id === b2)) delete x.pair; });
    m.pair = { id: b2, offset: 0 }; saveBooks(); toast('Связано. В читалке появится кнопка параллельного текста'); return renderMain();
  }
  if (act === 'pairbreak'){ const m = state.books.find(x => x.id === id); if (m) delete m.pair; saveBooks(); return renderMain(); }
  if (act === 'dictopen') return pushSheet({ mode:'dict', theme:'t-page', q:'', open:null });
  if (act === 'dword'){ const ds = dictState(); ds.open = ds.open === id ? null : id; ds.confirmDel = null; return afterDictChange(); }
  if (act === 'dwsave'){
    const w = state.dict.find(x => x.id === id); if (!w) return;
    const t = (document.getElementById('dw-term') || {}).value, tr = (document.getElementById('dw-tr') || {}).value;
    if (t && t.trim()) w.term = t.trim();
    w.tr = (tr || '').trim(); saveDict(); dictState().open = null; toast('Сохранено'); return afterDictChange();
  }
  if (act === 'dwdel'){
    const ds = dictState();
    if (ds.confirmDel !== id){ ds.confirmDel = id; return afterDictChange(); }
    state.dict = state.dict.filter(x => x.id !== id); saveDict(); ds.open = null; ds.confirmDel = null; return afterDictChange();
  }
  if (act === 'seg'){ const [t, k] = id.split(':'); state.sub[t] = k; lsSet(LS_SUB, state.sub); renderMain(); window.scrollTo(0, 0); return; }
  if (act === 'homeconf') return pushSheet({ mode:'home', theme:'t-page' });
  if (act === 'homeon' || act === 'homeup' || act === 'homedown'){
    const c = homeConf();
    if (act === 'homeon'){ if (c.off.has(id)) c.off.delete(id); else c.off.add(id); }
    else { const i = c.order.indexOf(id), j = act === 'homeup' ? i - 1 : i + 1; if (i >= 0 && j >= 0 && j < c.order.length){ const tmp = c.order[i]; c.order[i] = c.order[j]; c.order[j] = tmp; } }
    saveHome(c); renderMain(); return renderSheet(true);
  }
  if (act === 'wordflip'){ state.wordShown = !state.wordShown; return renderMain(); }
  if (act === 'gotoexp'){ state.tab = 'practice'; state.sub.practice = 'exp'; lsSet(LS_SUB, state.sub); renderMain(); window.scrollTo(0, 0); return; }
  if (act === 'progress'){ state.tab = 'growth'; state.sub.growth = 'progress'; lsSet(LS_SUB, state.sub); renderMain(); window.scrollTo(0, 0); return; }
  if (act === 'expnew') return pushSheet({ mode:'expnew', theme:'t-page', title:'', type:'avoid', target:7, why:'' });
  if (act === 'exppreset'){ const i = id.lastIndexOf('|'); state.sheet.title = id.slice(0, i); state.sheet.type = id.slice(i + 1); return renderSheet(true); }
  if (act === 'exptype'){ state.sheet.type = id; return renderSheet(true); }
  if (act === 'exptarget'){ state.sheet.target = Number(id); return renderSheet(true); }
  if (act === 'expstart'){
    const sh = state.sheet; const title = (((document.getElementById('exp-title') || {}).value) || sh.title || '').trim();
    if (!title){ toast('Нужно название'); return; }
    const why = (((document.getElementById('exp-why') || {}).value) || sh.why || '').trim();
    const now = Date.now();
    state.exps.unshift({ id:'x' + now.toString(36) + Math.random().toString(36).slice(2, 5), title: title.slice(0, 60), type: sh.type === 'do' ? 'do' : 'avoid', target: sh.target || 0, why, createdAt: now, startAt: now, lastFail: null, status:'active', days:{} });
    saveExps(); closeAll(); state.tab = 'practice'; state.sub.practice = 'exp'; lsSet(LS_SUB, state.sub); renderMain(); window.scrollTo(0, 0); toast('Эксперимент начат. Срыв это не конец, а данные'); return;
  }
  if (act === 'expopen') return pushSheet({ mode:'exp', theme:'t-page', id });
  if (act === 'expmark'){
    const i = id.lastIndexOf(':'), eid = id.slice(0, i), v = id.slice(i + 1); const e = expById(eid); if (!e) return;
    e.days = e.days || {}; const k = today();
    if (e.days[k] === v) delete e.days[k]; else e.days[k] = v;
    if (e.type === 'avoid'){ if (e.days[k] === 'fail') e.lastFail = Date.now(); else if (v === 'fail') e.lastFail = lastFailFromDays(e); }
    if (e.target && e.status === 'active' && expProgress(e) >= 1){ e.status = 'done'; e.endedAt = Date.now(); toast('Цель достигнута, +50 XP'); }
    saveExps(); renderMain(); if (state.sheet && state.sheet.mode === 'exp') renderSheet(true); return;
  }
  if (act === 'expfinish'){ const e = expById(id); if (e){ e.status = 'done'; e.endedAt = Date.now(); saveExps(); toast('Завершен, +50 XP'); } renderMain(); return renderSheet(true); }
  if (act === 'expstop'){ const e = expById(id); if (e){ e.status = 'stopped'; e.endedAt = Date.now(); saveExps(); } renderMain(); return renderSheet(true); }
  if (act === 'expresume'){ const e = expById(id); if (e){ e.status = 'active'; delete e.endedAt; saveExps(); } renderMain(); return renderSheet(true); }
  if (act === 'expdel'){ if (!state.sheet.confirmDel){ state.sheet.confirmDel = true; return renderSheet(true); } state.exps = state.exps.filter(x => x.id !== id); saveExps(); closeAll(); return renderMain(); }
  if (act === 'dictquizlet'){ const ok = await copyText(dictTsv()); toast(ok ? 'Скопировано. В Quizlet: Создать модуль → Импорт → вставить' : 'Не получилось скопировать'); return; }
  if (act === 'dictcsv'){
    const q = v => '"' + String(v || '').replace(/"/g, '""') + '"';
    const rows = [['term','translation','definition','context','book','added']].concat(state.dict.map(w => [w.term, w.tr, w.def, w.ctx, w.bookTitle, new Date(w.addedAt).toISOString().slice(0, 10)]));
    downloadFile('portik-dictionary-' + today() + '.csv', '\ufeff' + rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
    return;
  }
  if (act === 'export') return exportData();
  if (act === 'import'){ const f = document.getElementById('import-file'); if (f) f.click(); return; }
  if (act === 'time') return pushSheet({ mode:'time', theme:'t-page', edit:false });
  if (act === 'tset'){ state.sheet.edit = !state.sheet.edit; return renderSheet(true); }
  if (act === 'tstep'){
    const [k, d] = id.split(':'); const T = state.time;
    if (k === 'life') T.lifeYears = Math.min(110, Math.max(40, T.lifeYears + Number(d)));
    else T.wakeHours = Math.min(20, Math.max(10, T.wakeHours + Number(d)));
    saveTime(); renderMain(); return renderSheet(true);
  }
  if (act === 'sinksug' || act === 'sinkadd'){
    const inp = document.getElementById('sink-name');
    const name = (act === 'sinksug' ? id : (inp ? inp.value : '')).trim().slice(0, 40);
    if (!name) return;
    if (state.time.sinks.some(x => x.name.toLowerCase() === name.toLowerCase())){ toast('Такой пожиратель уже есть'); return; }
    state.time.sinks.push({ id:'s' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, perDay:30 });
    saveTime(); renderMain(); return renderSheet(true);
  }
  if (act === 'sinkdel'){
    if (state.sheet.confirmSink !== id){ state.sheet.confirmSink = id; return renderSheet(true); }
    state.sheet.confirmSink = null;
    state.time.sinks = state.time.sinks.filter(x => x.id !== id);
    Object.keys(state.time.log).forEach(k => { if (state.time.log[k]) delete state.time.log[k][id]; });
    saveTime(); renderMain(); return renderSheet(true);
  }
  if (act === 'sinkest' || act === 'sinklog'){
    const i = id.lastIndexOf(':'), sid = id.slice(0, i), d = Number(id.slice(i + 1));
    const sk = state.time.sinks.find(x => x.id === sid); if (!sk) return;
    if (act === 'sinkest'){
      const cur = sk.perDay || 0;
      const step = (d > 0 ? cur >= 60 : cur > 60) ? 15 : 5;
      sk.perDay = Math.min(720, Math.max(0, cur + d * step));
    } else {
      const k = today(); const L = state.time.log[k] = state.time.log[k] || {};
      L[sid] = Math.max(0, (L[sid] || 0) + d);
    }
    saveTime(); renderMain(); return renderSheet(true);
  }
  if (act === 'sinkuse'){
    const sk = state.time.sinks.find(x => x.id === id); const avg = sk ? logAvg(id) : null;
    if (sk && avg != null){ sk.perDay = Math.round(avg / 5) * 5; saveTime(); renderMain(); renderSheet(true); }
    return;
  }
  if (act === 'begin') return startExercise(EXMAP[id]);
  if (act === 'close') return closeSheet();
  if (act === 'next'){ state.sheet.i++; saveDraft(); return renderSheet(); }
  if (act === 'prev'){ state.sheet.i--; saveDraft(); return renderSheet(); }
  if (act === 'save') return saveSession();
  if (act === 'vpick'){
    const st = state.sheet.steps[state.sheet.i];
    const k = st.key + '_v';
    state.sheet.answers[k] = state.sheet.answers[k] === id ? '' : id;
    $sheet.querySelectorAll('[data-act="vpick"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.id === state.sheet.answers[k])));
    saveDraft();
    return;
  }
  if (act === 'vmode'){ state.vMode = id; return renderMain(); }
  if (act === 'vwin'){ state.vWindow = Number(id); return renderMain(); }
  if (act === 'src'){ state.src = id; return renderMain(); }
  if (act === 'disc'){ const n = Number(id); state.disc.has(n) ? state.disc.delete(n) : state.disc.add(n); return renderMain(); }
  if (act === 'entry'){ state.openEntry = state.openEntry === id ? null : id; state.confirmDel = null; return renderMain(); }
  if (act === 'del'){
    if (state.confirmDel !== id){ state.confirmDel = id; return renderMain(); }
    state.confirmDel = null; state.openEntry = null; await store.remove(id); return;
  }
  if (act === 'pradd'){ state.principles.push(''); state.principlesDirty = true; renderMain(); const tas = $main.querySelectorAll('[data-pr]'); if (tas.length) tas[tas.length-1].focus(); return; }
  if (act === 'prdel'){ state.principles.splice(Number(id), 1); state.principlesDirty = true; return renderMain(); }
  if (act === 'prsave'){
    state.principles = state.principles.map(p => p.trim()).filter(Boolean);
    await store.savePrinciples(state.principles);
    state.principlesDirty = false;
    toast('Принципы сохранены'); return renderMain();
  }
}
document.addEventListener('click', ev => { const b = ev.target.closest('[data-act]'); if (b) onAct(b); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && state.reader){ if (state.reader.panel) closeRPanel(); else closeReader(); return; }
  if (ev.key === 'Escape' && state.sheet) return closeSheet();
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'sink-name'){ ev.preventDefault(); return onAct({ dataset:{ act:'sinkadd' } }); }
  const t = ev.target;
  if ((ev.key === 'Enter' || ev.key === ' ') && t && t.tagName && t.tagName.toLowerCase() === 'path' && t.dataset.act){ ev.preventDefault(); onAct(t); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.matches('textarea')) autosize(el);
  if (el.dataset.key && state.sheet && state.sheet.mode === 'session'){
    state.sheet.answers[el.dataset.key] = el.value;
    clearTimeout(document._dT); document._dT = setTimeout(saveDraft, 400);
  }
  if (el.dataset.rate && state.sheet && state.sheet.mode === 'rating'){
    state.sheet.values[el.dataset.rate] = Number(el.value);
    const o = document.getElementById('out-' + el.dataset.rate); if (o) o.textContent = el.value;
  }
  if (el.dataset.pr !== undefined){ state.principles[Number(el.dataset.pr)] = el.value; state.principlesDirty = true; }
  if (el.id === 'dsearch'){
    const ds = dictState(); ds.q = el.value; const pos = el.selectionStart; afterDictChange();
    const n = document.getElementById('dsearch'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} }
    return;
  }
  if (el.id === 'exp-title' && state.sheet){ state.sheet.title = el.value; return; }
  if (el.id === 'exp-why' && state.sheet){ state.sheet.why = el.value; return; }
  if (el.id === 'cut'){
    state.time.cut = Number(el.value) / 100;
    const a = document.getElementById('cut-val'); if (a) a.textContent = el.value + '%';
    const b = document.getElementById('cut-ret'); if (b) b.textContent = cutText(timeStats(), state.time.cut);

});
document.addEventListener('change', ev => {

  if (el.id === 'book-file' && el.files && el.files[0]){ const f = el.files[0]; el.value = ''; addBookFile(f); return; }
  if (el.id === 'import-file' && el.files && el.files[0]){ const f = el.files[0]; el.value = ''; importFile(f); return; }
